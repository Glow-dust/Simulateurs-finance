<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculette de Reves</title>
  <style>
    :root {
      --bg: #05070d;
      --bg2: #0a0f1c;
      --panel: #0f1628cc;
      --line: #22324f;
      --text: #e8eeff;
      --muted: #9db0d6;
      --base: #36d0b7;
      --base2: #4f8fff;
      --interest: #ff5cc7;
      --interest-dark: #7d1038;
      --base-fill-a: #36d0b744;
      --base-fill-b: #4f8fff22;
      --interest-fill-a: #ff5cc744;
      --interest-fill-b: #7d103822;
      --star: #ffb347;
      --danger: #ff6f6f;
      --ok: #80ffbf;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, #0e1c3d 0%, transparent 25%),
        radial-gradient(circle at 82% 12%, rgba(78, 233, 255, 0.22) 0%, rgba(78, 233, 255, 0.12) 14%, rgba(78, 233, 255, 0.04) 30%, transparent 55%),
        radial-gradient(circle at 70% 75%, #0f2a36 0%, transparent 20%),
        linear-gradient(160deg, var(--bg), var(--bg2));
      overflow-x: hidden;
    }

    .stars, .stars::before, .stars::after {
      position: fixed;
      content: "";
      inset: 0;
      pointer-events: none;
      background-repeat: repeat;
    }
    .stars {
      opacity: 0.45;
      background-image:
        radial-gradient(2px 2px at 10% 20%, #ffffffcc 60%, transparent 61%),
        radial-gradient(1.6px 1.6px at 40% 70%, #b9d6ffcc 60%, transparent 61%),
        radial-gradient(1.8px 1.8px at 77% 33%, #fff0c8dd 60%, transparent 61%),
        radial-gradient(1.4px 1.4px at 23% 84%, #d6dfffcc 60%, transparent 61%);
      animation: drift 90s linear infinite;
    }
    .stars::before {
      opacity: 0.35;
      transform: scale(1.2);
      background-image:
        radial-gradient(1.2px 1.2px at 60% 25%, #ffffffbb 60%, transparent 61%),
        radial-gradient(1.6px 1.6px at 17% 58%, #ffdca8cc 60%, transparent 61%),
        radial-gradient(1.2px 1.2px at 88% 81%, #d9e8ffbb 60%, transparent 61%);
      animation: drift 120s linear infinite reverse;
    }
    .stars::after {
      opacity: 0.2;
      transform: scale(1.35);
      background-image:
        radial-gradient(1.8px 1.8px at 35% 30%, #ffffffaa 60%, transparent 61%),
        radial-gradient(1.4px 1.4px at 74% 62%, #ffe4b8aa 60%, transparent 61%);
      animation: drift 150s linear infinite;
    }
    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-120px); }
    }

    .wrap {
      max-width: 1150px;
      margin: 24px auto;
      padding: 14px;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 6px 0 16px;
      font-size: clamp(1.4rem, 2.7vw, 2rem);
      color: #f2f6ff;
      letter-spacing: 0;
    }
    .hub-link {
      display: inline-block;
      margin-bottom: 8px;
      color: #9ddcff;
      text-decoration: none;
      border: 1px solid #365988;
      border-radius: 7px;
      padding: 6px 10px;
      background: #0a1730b8;
    }

    .tabs {
      display: inline-flex;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
      background: #0b1120b0;
      margin-bottom: 14px;
    }
    .tab-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active {
      color: #fff;
      border-color: #3a4f77;
      background: #16233f;
    }

    .panel {
      display: none;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 10px;
      padding: 14px;
      backdrop-filter: blur(2px);
    }
    .panel.active { display: block; }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .btn {
      border: 1px solid #49639a;
      background: #1b2a49;
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .help { color: var(--muted); font-size: 0.92rem; }

    .form {
      display: none;
      border: 1px solid #2e446f;
      background: #0d1830cc;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .form.show { display: block; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(170px, 1fr));
      gap: 8px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-size: 0.84rem; color: #d4dfff; }
    input, select {
      width: 100%;
      border: 1px solid #3b5484;
      background: #0a1327;
      color: #fff;
      border-radius: 7px;
      padding: 8px;
      font-size: 0.95rem;
    }

    .actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn.secondary {
      background: #0e1a33;
      border-color: #39527f;
      color: #d9e4ff;
    }

    .list {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 8px;
    }
    .card {
      border: 1px solid #2a3e64;
      border-radius: 8px;
      background: #0a1429c9;
      padding: 10px;
    }
    .goal-card {
      border: 1px solid #8d6b1f;
      background: linear-gradient(160deg, #2a1f10d8 0%, #3f2c12cf 56%, #563114c8 100%);
      box-shadow: inset 0 0 0 1px #ffd98f2b;
    }
    .goal-card h3 { color: #ffd98f; }
    .goal-card .meta { color: #ffedc6; }
    .pocket-card {
      border: 1px solid #2f6a79;
      background: linear-gradient(160deg, #0f2f32d8 0%, #11384acb 52%, #173662c8 100%);
      box-shadow: inset 0 0 0 1px #9ddcff2f;
    }
    .pocket-card h3 { color: #92f2df; }
    .pocket-card .meta { color: #c1eeff; }
    .card h3 {
      margin: 0 0 6px;
      font-size: 0.98rem;
    }
    .meta {
      color: #c4d4ff;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .delete {
      margin-top: 8px;
      border: 1px solid #855;
      background: #34161b;
      color: #ffd3d3;
      border-radius: 6px;
      cursor: pointer;
      padding: 6px 8px;
      font-size: 0.84rem;
    }
    .edit {
      margin-top: 8px;
      margin-right: 6px;
      border: 1px solid #49639a;
      background: #162744;
      color: #dbe8ff;
      border-radius: 6px;
      cursor: pointer;
      padding: 6px 8px;
      font-size: 0.84rem;
    }

    .chart-panel {
      margin-top: 14px;
      border: 1px solid #30466f;
      border-radius: 10px;
      background: #091326d6;
      padding: 10px;
    }
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin: 8px 0 6px;
      font-size: 0.88rem;
      color: #d9e4ff;
    }
    .dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: -1px;
    }
    .d-base { background: linear-gradient(90deg, var(--base), var(--base2)); }
    .d-int { background: linear-gradient(90deg, var(--interest), var(--interest-dark)); }
    .d-star { background: var(--star); }
    .result-note {
      margin: 10px 2px 0;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #e4eeff;
    }
    .result-note.ok { color: #9bffc8; }
    .result-note.warn { color: #ffd7b2; }

    .msg { color: var(--ok); font-size: 0.9rem; }
    .msg.error { color: var(--danger); }

    canvas {
      width: 100%;
      height: min(52vh, 460px);
      border-radius: 8px;
      border: 1px solid #27406b;
      background: linear-gradient(180deg, #050913 0%, #070f1f 100%);
      display: block;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
    }
    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
      .tab-btn { padding: 8px 10px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <main class="wrap">
    <a class="hub-link" href="/simulateurs-finance/index.html">← Retour au hub</a>
    <h1>Calculette de rêves</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="goals">Mes objectifs revés</button>
      <button class="tab-btn" data-tab="pockets">La réalisation de mes rêves</button>
    </div>

    <section class="panel active" id="goals">
      <div class="top-row">
        <div class="help">Ajoute autant d’objectifs que tu veux.</div>
        <button class="btn" id="btnAddGoal">+ Ajouter</button>
      </div>

      <form class="form" id="goalForm">
        <div class="grid">
          <div class="field">
            <label for="goalTitle">Titre</label>
            <input id="goalTitle" required placeholder="Ex: Maison en bord de mer" />
          </div>
          <div class="field">
            <label for="goalAmount">Montant (€)</label>
            <input id="goalAmount" type="number" min="0" step="1" required placeholder="500" />
          </div>
          <div class="field">
            <label for="goalFrequency">Périodicité</label>
            <select id="goalFrequency" required>
              <option value="mensuel">Mensuel</option>
              <option value="annuel">Annuel</option>
              <option value="one-shot">One shot</option>
            </select>
          </div>
          <div class="field">
            <label for="goalDeadline">Echéance (années)</label>
            <input id="goalDeadline" type="number" min="1" step="1" required placeholder="10" />
          </div>
          <div class="field" id="goalDurationField">
            <label for="goalDuration">Durée (années)</label>
            <input id="goalDuration" type="text" required placeholder="5 ou indefini" />
          </div>
        </div>
        <div class="actions">
          <button class="btn" type="submit" id="goalSubmit">Enregistrer l’objectif</button>
          <button class="btn secondary" type="button" id="goalCancel">Annuler</button>
        </div>
      </form>
      <div class="msg" id="goalMsg"></div>
      <div class="list" id="goalList"></div>
    </section>

    <section class="panel" id="pockets">
      <div class="top-row">
        <div class="help">Ajoute des poches financières.</div>
        <button class="btn" id="btnAddPocket">+ Ajouter</button>
      </div>

      <form class="form" id="pocketForm">
        <div class="grid">
          <div class="field">
            <label for="pocketTitle">Titre</label>
            <input id="pocketTitle" required placeholder="Ex: ETF Monde" />
          </div>
          <div class="field">
            <label for="pocketInitial">Montant initial (€)</label>
            <input id="pocketInitial" type="number" min="0" step="1" required placeholder="5000" />
          </div>
          <div class="field">
            <label for="pocketMonthly">Investissement mensuel (€)</label>
            <input id="pocketMonthly" type="number" min="0" step="1" required placeholder="400" />
          </div>
          <div class="field">
            <label for="pocketDuring">Pendant (années)</label>
            <input id="pocketDuring" type="number" min="0" step="0.5" required placeholder="10" />
          </div>
          <div class="field">
            <label for="pocketYield">Rendement annuel (%)</label>
            <input id="pocketYield" type="number" step="0.1" required placeholder="7" />
          </div>
        </div>
        <div class="actions">
          <button class="btn" type="submit" id="pocketSubmit">Enregistrer la poche</button>
          <button class="btn secondary" type="button" id="pocketCancel">Annuler</button>
        </div>
      </form>

      <div class="msg" id="pocketMsg"></div>
      <div class="list" id="pocketList"></div>

      <div class="chart-panel">
        <div class="legend">
          <span><i class="dot d-base"></i>Base investie (montant initial + versements)</span>
          <span><i class="dot d-int"></i>Intérêts composés</span>
          <span><i class="dot d-star"></i>Etoiles objectifs atteints</span>
        </div>
        <canvas id="chart" width="1100" height="460"></canvas>
        <p class="result-note" id="resultNote"></p>
      </div>
    </section>
  </main>

  <script>
    const goals = [];
    const pockets = [];

    const fmtEur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
    const byId = (id) => document.getElementById(id);

    const tabButtons = document.querySelectorAll(".tab-btn");
    const panels = document.querySelectorAll(".panel");
    tabButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabButtons.forEach((b) => b.classList.remove("active"));
        panels.forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        byId(btn.dataset.tab).classList.add("active");
        if (btn.dataset.tab === "pockets") requestAnimationFrame(drawChart);
      });
    });

    function parseDuration(value) {
      const clean = String(value).trim().toLowerCase();
      if (["indefini", "indéfini", "infini", "infinite", "infinie"].includes(clean)) return Infinity;
      const n = Number(clean);
      return Number.isFinite(n) && n > 0 ? n : NaN;
    }

    const goalForm = byId("goalForm");
    const goalMsg = byId("goalMsg");
    const goalList = byId("goalList");
    const btnAddGoal = byId("btnAddGoal");
    const goalCancel = byId("goalCancel");
    const goalSubmit = byId("goalSubmit");
    const goalFrequency = byId("goalFrequency");
    const goalDurationField = byId("goalDurationField");
    const goalDurationInput = byId("goalDuration");
    let editingGoalId = null;

    function syncGoalDurationVisibility() {
      const isOneShot = goalFrequency.value === "one-shot";
      goalDurationField.style.display = isOneShot ? "none" : "flex";
      goalDurationInput.required = !isOneShot;
      if (isOneShot) goalDurationInput.value = "";
    }

    goalFrequency.addEventListener("change", syncGoalDurationVisibility);
    syncGoalDurationVisibility();

    btnAddGoal.addEventListener("click", () => {
      goalMsg.textContent = "";
      editingGoalId = null;
      goalSubmit.textContent = "Enregistrer l’objectif";
      goalForm.reset();
      goalForm.classList.toggle("show");
      syncGoalDurationVisibility();
    });
    goalCancel.addEventListener("click", () => {
      goalForm.classList.remove("show");
      editingGoalId = null;
      goalSubmit.textContent = "Enregistrer l’objectif";
      goalForm.reset();
      syncGoalDurationVisibility();
    });

    goalForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = byId("goalTitle").value.trim();
      const amount = Number(byId("goalAmount").value);
      const frequency = byId("goalFrequency").value;
      const deadlineYears = Number(byId("goalDeadline").value);
      const durationRaw = byId("goalDuration").value;
      const durationYears = frequency === "one-shot" ? null : parseDuration(durationRaw);

      if (!title || !Number.isFinite(amount) || amount <= 0 || !Number.isFinite(deadlineYears) || deadlineYears <= 0 || (frequency !== "one-shot" && !durationYears)) {
        goalMsg.className = "msg error";
        goalMsg.textContent = "Vérifie les champs objectif.";
        return;
      }

      const payload = {
        id: editingGoalId ?? crypto.randomUUID(),
        title,
        amount,
        frequency,
        deadlineYears,
        durationYears,
      };
      if (editingGoalId) {
        const idx = goals.findIndex((g) => g.id === editingGoalId);
        if (idx >= 0) goals[idx] = payload;
      } else {
        goals.push(payload);
      }
      goalForm.reset();
      goalForm.classList.remove("show");
      editingGoalId = null;
      goalSubmit.textContent = "Enregistrer l’objectif";
      goalMsg.className = "msg";
      goalMsg.textContent = "Objectif mis à jour automatiquement.";
      renderGoals();
      drawChart();
    });

    function renderGoals() {
      goalList.innerHTML = "";
      goals.forEach((g) => {
        const totalCost = getGoalTarget(g);
        const card = document.createElement("article");
        card.className = "card goal-card";
        card.innerHTML = `
          <h3>${escapeHtml(g.title)}</h3>
          <div class="meta">
            Montant: ${fmtEur.format(g.amount)} (${g.frequency})<br/>
            Echéance: ${g.deadlineYears} ans<br/>
            Durée: ${g.frequency === "one-shot" ? "non applicable" : (Number.isFinite(g.durationYears) ? `${g.durationYears} ans` : "indéfini")}<br/>
            Montant cible estimé: ${fmtEur.format(totalCost)}
          </div>
          <button class="edit" data-edit-goal="${g.id}">Modifier</button>
          <button class="delete" data-del-goal="${g.id}">Supprimer</button>
        `;
        goalList.appendChild(card);
      });

      goalList.querySelectorAll("[data-edit-goal]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-edit-goal");
          const g = goals.find((item) => item.id === id);
          if (!g) return;
          editingGoalId = id;
          byId("goalTitle").value = g.title;
          byId("goalAmount").value = g.amount;
          byId("goalFrequency").value = g.frequency;
          byId("goalDeadline").value = g.deadlineYears;
          byId("goalDuration").value = g.frequency === "one-shot" ? "" : (g.durationYears === Infinity ? "indefini" : g.durationYears);
          syncGoalDurationVisibility();
          goalSubmit.textContent = "Mettre à jour l’objectif";
          goalForm.classList.add("show");
          goalMsg.className = "msg";
          goalMsg.textContent = "Edition de l’objectif en cours.";
        });
      });

      goalList.querySelectorAll("[data-del-goal]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del-goal");
          const i = goals.findIndex((g) => g.id === id);
          if (i >= 0) goals.splice(i, 1);
          if (editingGoalId === id) {
            editingGoalId = null;
            goalSubmit.textContent = "Enregistrer l’objectif";
            goalForm.reset();
            goalForm.classList.remove("show");
            syncGoalDurationVisibility();
          }
          renderGoals();
          drawChart();
        });
      });
    }

    const pocketForm = byId("pocketForm");
    const pocketMsg = byId("pocketMsg");
    const pocketList = byId("pocketList");
    const btnAddPocket = byId("btnAddPocket");
    const pocketCancel = byId("pocketCancel");
    const pocketSubmit = byId("pocketSubmit");
    const resultNote = byId("resultNote");
    let editingPocketId = null;

    btnAddPocket.addEventListener("click", () => {
      pocketMsg.textContent = "";
      editingPocketId = null;
      pocketSubmit.textContent = "Enregistrer la poche";
      pocketForm.reset();
      pocketForm.classList.toggle("show");
    });
    pocketCancel.addEventListener("click", () => {
      pocketForm.classList.remove("show");
      editingPocketId = null;
      pocketSubmit.textContent = "Enregistrer la poche";
      pocketForm.reset();
    });

    pocketForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = byId("pocketTitle").value.trim();
      const initial = Number(byId("pocketInitial").value);
      const monthly = Number(byId("pocketMonthly").value);
      const duringYears = Number(byId("pocketDuring").value);
      const annualYieldPct = Number(byId("pocketYield").value);

      if (!title || initial < 0 || monthly < 0 || !Number.isFinite(duringYears) || duringYears < 0 || !Number.isFinite(annualYieldPct)) {
        pocketMsg.className = "msg error";
        pocketMsg.textContent = "Vérifie les champs poche.";
        return;
      }

      const payload = {
        id: editingPocketId ?? crypto.randomUUID(),
        title,
        initial,
        monthly,
        duringYears,
        annualYieldPct,
      };
      if (editingPocketId) {
        const idx = pockets.findIndex((p) => p.id === editingPocketId);
        if (idx >= 0) pockets[idx] = payload;
      } else {
        pockets.push(payload);
      }
      pocketForm.reset();
      pocketForm.classList.remove("show");
      editingPocketId = null;
      pocketSubmit.textContent = "Enregistrer la poche";
      pocketMsg.className = "msg";
      pocketMsg.textContent = "Poche mise à jour automatiquement.";
      renderPockets();
      drawChart();
    });

    function renderPockets() {
      pocketList.innerHTML = "";
      pockets.forEach((p) => {
        const card = document.createElement("article");
        card.className = "card pocket-card";
        card.innerHTML = `
          <h3>${escapeHtml(p.title)}</h3>
          <div class="meta">
            Initial: ${fmtEur.format(p.initial)}<br/>
            Mensuel: ${fmtEur.format(p.monthly)}<br/>
            Pendant: ${p.duringYears} ans<br/>
            Rendement: ${p.annualYieldPct}%
          </div>
          <button class="edit" data-edit-pocket="${p.id}">Modifier</button>
          <button class="delete" data-del-pocket="${p.id}">Supprimer</button>
        `;
        pocketList.appendChild(card);
      });
      pocketList.querySelectorAll("[data-edit-pocket]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-edit-pocket");
          const p = pockets.find((item) => item.id === id);
          if (!p) return;
          editingPocketId = id;
          byId("pocketTitle").value = p.title;
          byId("pocketInitial").value = p.initial;
          byId("pocketMonthly").value = p.monthly;
          byId("pocketDuring").value = p.duringYears;
          byId("pocketYield").value = p.annualYieldPct;
          pocketSubmit.textContent = "Mettre à jour la poche";
          pocketForm.classList.add("show");
          pocketMsg.className = "msg";
          pocketMsg.textContent = "Edition de la poche en cours.";
        });
      });
      pocketList.querySelectorAll("[data-del-pocket]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del-pocket");
          const i = pockets.findIndex((p) => p.id === id);
          if (i >= 0) pockets.splice(i, 1);
          if (editingPocketId === id) {
            editingPocketId = null;
            pocketSubmit.textContent = "Enregistrer la poche";
            pocketForm.reset();
            pocketForm.classList.remove("show");
          }
          renderPockets();
          drawChart();
        });
      });
    }

    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function simulate(totalMonths, goalsForPlan = []) {
      const points = [];
      const states = pockets.map((p) => ({
        value: p.initial,
        base: p.initial,
        monthlyRate: Math.pow(1 + p.annualYieldPct / 100, 1 / 12) - 1,
        monthlyContribution: p.monthly,
        contributionMonths: Math.round(p.duringYears * 12),
      }));
      points.push({
        month: 0,
        base: states.reduce((a, s) => a + s.base, 0),
        value: states.reduce((a, s) => a + s.value, 0),
      });

      const achievements = [...goalsForPlan]
        .map((g) => ({
          ...g,
          target: getGoalTarget(g),
          deadlineMonth: Math.round(g.deadlineYears * 12),
          achievedMonth: null,
          active: false,
        }))
        .sort((a, b) => a.deadlineMonth - b.deadlineMonth);
      const activeGoals = [];
      let nextGoalIndex = 0;

      for (let m = 1; m <= totalMonths; m++) {
        states.forEach((s) => {
          const contribution = m <= s.contributionMonths ? s.monthlyContribution : 0;
          s.base += contribution;
          s.value = (s.value + contribution) * (1 + s.monthlyRate);
        });
        let totalValue = states.reduce((a, s) => a + s.value, 0);

        while (nextGoalIndex < achievements.length) {
          const g = achievements[nextGoalIndex];
          if (m < g.deadlineMonth) break;
          const startCost = getGoalMonthlyCostAt(g, m, m);
          if (startCost <= 0 || totalValue < startCost) break;
          g.achievedMonth = m;
          g.active = g.frequency !== "one-shot";
          withdrawFromStates(states, startCost);
          totalValue = states.reduce((a, s) => a + s.value, 0);
          if (g.frequency === "one-shot") g.active = false;
          else activeGoals.push(g);
          nextGoalIndex += 1;
        }

        activeGoals.forEach((g) => {
          if (g.achievedMonth === null || m === g.achievedMonth) return;
          const recurringCost = getGoalMonthlyCostAt(g, m, g.achievedMonth);
          if (recurringCost <= 0) return;
          withdrawFromStates(states, recurringCost);
        });

        for (let i = activeGoals.length - 1; i >= 0; i--) {
          const g = activeGoals[i];
          if (g.durationYears === Infinity) continue;
          const durationMonths = Math.round(g.durationYears * 12);
          if (m >= g.achievedMonth + durationMonths) activeGoals.splice(i, 1);
        }

        points.push({
          month: m,
          base: states.reduce((a, s) => a + s.base, 0),
          value: states.reduce((a, s) => a + s.value, 0),
        });
      }
      return { points, achievements };
    }

    function withdrawFromStates(states, amount) {
      let remaining = Math.max(0, amount);
      if (!remaining) return;

      const gains = states.map((s) => Math.max(0, s.value - s.base));
      const totalGains = gains.reduce((a, g) => a + g, 0);
      if (totalGains > 0) {
        let gainsToTake = Math.min(remaining, totalGains);
        states.forEach((s, idx) => {
          if (gainsToTake <= 0) return;
          const g = gains[idx];
          if (g <= 0) return;
          const share = g / totalGains;
          const want = gainsToTake * share;
          const take = Math.min(g, want);
          s.value -= take;
          remaining -= take;
        });
        if (remaining > 0) {
          for (let i = 0; i < states.length && remaining > 0; i++) {
            const extraGain = Math.max(0, states[i].value - states[i].base);
            if (extraGain <= 0) continue;
            const take = Math.min(extraGain, remaining);
            states[i].value -= take;
            remaining -= take;
          }
        }
      }

      if (remaining > 0) {
        const totalBase = states.reduce((a, s) => a + Math.max(0, s.base), 0);
        if (totalBase <= 0) return;
        states.forEach((s) => {
          if (remaining <= 0) return;
          const share = Math.max(0, s.base) / totalBase;
          const want = remaining * share;
          const take = Math.min(s.base, want);
          s.base -= take;
          s.value -= take;
          remaining -= take;
        });
        if (remaining > 0) {
          for (const s of states) {
            if (remaining <= 0) break;
            const take = Math.min(s.base, remaining);
            s.base -= take;
            s.value -= take;
            remaining -= take;
          }
        }
      }

      states.forEach((s) => {
        s.base = Math.max(0, s.base);
        s.value = Math.max(0, s.value);
      });
    }

    function getGoalMonthlyCostAt(goal, month, startMonth) {
      if (goal.frequency === "one-shot") return month === startMonth ? goal.amount : 0;
      if (goal.frequency === "mensuel") {
        if (!Number.isFinite(goal.durationYears)) return goal.amount;
        const maxMonths = Math.round(goal.durationYears * 12);
        return month < startMonth + maxMonths ? goal.amount : 0;
      }
      if (goal.frequency === "annuel") {
        if (!Number.isFinite(goal.durationYears)) return ((month - startMonth) % 12 === 0) ? goal.amount : 0;
        const maxYears = Math.round(goal.durationYears);
        const elapsed = month - startMonth;
